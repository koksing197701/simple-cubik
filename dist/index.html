<!DOCTYPE html><html><head><title>Simple Cubik Demo</title><style>body{margin:0;background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;flex-direction:column;color:#fff}#cube-area{width:400px;height:400px}.controls{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}button{padding:6px 14px;border-radius:6px;border:1px solid #444;background:#333;color:#fff;cursor:pointer;font-size:14px}button:hover{background:#555}.info{text-align:center;margin-bottom:12px;font-size:14px;color:#aaa}</style></head><body><div class="info">Simple Cubik v2.8 — Modular API</div><div id="cube-area"></div><div class="controls"><button onclick="cube.mix(12)">🔀 Mix</button><button onclick="cube.reset()">🔄 Reset</button><button onclick="cube.doMove('S')">S+</button><button onclick="cube.doMove("S'")">S-</button><button onclick="alert(JSON.stringify(cube.getState().slice(0,9)))">Log State</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="simple-cubik.js"></script><script>var cube=new SimpleCubik("#cube-area",{view:"3d"});console.log("Simple Cubik v2.8 ready");window.cube=cube;</script></body></html>
